name: Verify public research evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy==2.3.5
      - run: python scripts/run_checks.py
      - run: python scripts/verify_release.py
      - run: node scripts/check_research_dashboard.cjs
      - run: python scripts/run_notebooks.py
